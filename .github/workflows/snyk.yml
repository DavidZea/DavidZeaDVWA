name: Snyk Security Scan
  on:
    push:
      branches: [ "main", "master" ]
    pull_request:
      branches: [ "main", "master" ]
  jobs:
    security:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '18'
        - name: Instalar Snyk
          run: npm install -g snyk
        - name: Snyk Code (SAST)
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          run: snyk code test